name: build-debug

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit test
        run: ./gradlew testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Assemble debug
        run: ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Resolve version
        id: version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('app/build/outputs/apk/debug/output-metadata.json'))['elements'][0]['versionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/my-tv-${{ steps.version.outputs.name }}-debug.apk"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-${{ steps.version.outputs.name }}-debug
          path: dist/my-tv-${{ steps.version.outputs.name }}-debug.apk
