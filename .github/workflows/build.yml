name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::缺少签名 secrets：KEYSTORE / KEYSTORE_PASSWORD / ALIAS / ALIAS_PASSWORD"
            exit 1
          fi

      - name: Unit test
        run: ./gradlew testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Assemble release
        run: ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Resolve version
        id: version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('app/build/outputs/apk/release/output-metadata.json'))['elements'][0]['versionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION"

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          alias: ${{ secrets.ALIAS }}
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ALIAS_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "dist/my-tv-${{ steps.version.outputs.name }}.apk"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-${{ steps.version.outputs.name }}
          path: dist/my-tv-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          ASSET="dist/my-tv-${{ steps.version.outputs.name }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖其中的 APK"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "my-tv ${{ steps.version.outputs.name }}" \
              --notes "自动构建 $(date -u '+%Y-%m-%d %H:%M:%S') UTC，提交 ${{ github.sha }}" \
              --target "${{ github.sha }}"
          fi

      - name: Gitee Create Release (optional)
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_ACCESS_TOKEN，跳过 Gitee 发布"
            exit 0
          fi
          SHA=$(git rev-parse HEAD)
          curl -sS -X POST "https://gitee.com/api/v5/repos/${{ github.repository }}/releases?access_token=$GITEE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"v${{ steps.version.outputs.name }}\",\"name\":\"my-tv ${{ steps.version.outputs.name }}\",\"prerelease\":false,\"target_commitish\":\"$SHA\"}"
