plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号规则：{major}.{YYMM}.{BUILD_ID}
// major 在 version.json 中手动维护；YYMM 取构建时的年月（固定东八区，避免 CI 与本地跨月不一致）；
// BUILD_ID 由 CI 传入 -PbuildNumber=${{ github.run_number }}，本地回退到提交数。
def appVersion = DetectVersion()

android {
    namespace 'com.lizongying.mytv'
    compileSdk 34

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.lizongying.mytv"
        minSdk 21
        targetSdk 33
        versionCode appVersion.code
        versionName appVersion.name

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }
}

def DetectVersion() {
    def yymm = new Date().format("yyMM", TimeZone.getTimeZone("Asia/Shanghai"))
    def buildId = BuildId()
    def version = [
            code: yymm.toInteger() * 10000 + buildId,
            name: "${VersionMajor()}.${yymm}.${buildId}",
    ]
    println("Version ${version.code} ${version.name}")
    return version
}

// 主版本号在 version.json 中手动维护
def VersionMajor() {
    try {
        def json = new groovy.json.JsonSlurper().parse(rootProject.file("version.json"))
        return json.major as int
    } catch (ignored) {
        return 1
    }
}

// 自增构建号：显式参数 > CI 的 github.run_number > 提交数
def BuildId() {
    def fromProperty = project.findProperty("buildNumber")
    if (fromProperty != null && fromProperty.toString().isInteger()) {
        return fromProperty.toString().toInteger()
    }
    def fromEnv = System.getenv("GITHUB_RUN_NUMBER")
    if (fromEnv != null && fromEnv.isInteger()) {
        return fromEnv.toInteger()
    }
    try {
        def process = "git rev-list --count HEAD".execute()
        process.waitFor()
        def text = process.text.trim()
        if (text.isInteger()) {
            return text.toInteger()
        }
    } catch (ignored) {
    }
    return 1
}

dependencies {
    def media3_version = "1.3.1"

    implementation "androidx.media3:media3-ui:$media3_version"

    // For media playback using ExoPlayer
    implementation "androidx.media3:media3-exoplayer:$media3_version"

    // For HLS playback support with ExoPlayer
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"

    // 21:2.11.0 17:2.6.4
    def retrofit2_version = "2.11.0"

    implementation "com.squareup.retrofit2:converter-gson:$retrofit2_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit2_version"

    implementation 'androidx.leanback:leanback:1.2.0-alpha04'
    
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.core:core-ktx:1.13.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0-RC")

    implementation 'com.google.android.exoplayer:exoplayer-ui:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.13.3'

    testImplementation 'junit:junit:4.13.2'
}