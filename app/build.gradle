plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.lizongying.mytv'
    compileSdk 35
    buildToolsVersion '35.0.0'
    buildFeatures { viewBinding true }
    lint { lintConfig = file("lint.xml") }
    defaultConfig {
        applicationId "com.kandianshi.tv"
        minSdk 21
        targetSdk 33
        testInstrumentationRunner "com.lizongying.mytv.BackgroundHandoffInstrumentation"
        versionCode 10900
        versionName "1.9.0"
    }
    sourceSets { main.java.srcDirs = ['src/kandianshi/java'] }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = 17 }
    testOptions.unitTests.all {
        systemProperty "kandianshi.assets", file('src/main/assets').absolutePath
        systemProperty "kandianshi.inventory", file('build/reports/bundled-channels.tsv').absolutePath
    }
}
dependencies {
    def media3_version = "1.3.1"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation 'androidx.leanback:leanback:1.2.0-alpha04'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // Keep QR encoding compatible with Android 5 without Java 8 collection APIs.
    implementation 'com.google.zxing:core:3.3.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
