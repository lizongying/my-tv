plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lizongying.mytv'
    compileSdk 34

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.lizongying.mytv"
        minSdk 21
        targetSdk 33
        versionCode VersionCode()
        versionName VersionName()

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }
}

def VersionCode() {
    return DetectVersion().code
}

def VersionName() {
    return DetectVersion().name
}

def DetectVersion() {
    // 有 tag 的仓库走 git describe；无 tag（如 fork）回退到 version.json，避免算出 0
    def version = VersionFromGit() ?: VersionFromFile()
    println("Version ${version.code} ${version.name}")
    return version
}

// git describe --tags --always：有 tag 时为 v2.1.0 或 v2.1.0-3-gabc1234，无 tag 时为提交短哈希
def VersionFromGit() {
    try {
        def process = "git describe --tags --always".execute()
        process.waitFor()
        def text = process.text.trim()
        def matcher = text =~ /^v?(\d+)\.(\d+)\.(\d+)(?:-(\d+))?/
        if (!matcher.find()) {
            return null
        }
        def patch = matcher.group(4) == null ? 0 : matcher.group(4).toInteger()
        return [
                code: matcher.group(1).toInteger() * 16777216 + matcher.group(2).toInteger() * 65536 + matcher.group(3).toInteger() * 256 + patch,
                name: text.startsWith("v") ? text.substring(1) : text,
        ]
    } catch (ignored) {
        return null
    }
}

def VersionFromFile() {
    try {
        def json = new groovy.json.JsonSlurper().parse(rootProject.file("version.json"))
        return [
                code: json.version_code as int,
                name: (json.version_name as String).replaceFirst(/^v/, ""),
        ]
    } catch (ignored) {
        return [code: 1, name: "1.0.0"]
    }
}

dependencies {
    def media3_version = "1.3.1"

    implementation "androidx.media3:media3-ui:$media3_version"

    // For media playback using ExoPlayer
    implementation "androidx.media3:media3-exoplayer:$media3_version"

    // For HLS playback support with ExoPlayer
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"

    // 21:2.11.0 17:2.6.4
    def retrofit2_version = "2.11.0"

    implementation "com.squareup.retrofit2:converter-gson:$retrofit2_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit2_version"

    implementation 'androidx.leanback:leanback:1.2.0-alpha04'
    
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.core:core-ktx:1.13.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0-RC")

    implementation 'com.google.android.exoplayer:exoplayer-ui:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.13.3'

    testImplementation 'junit:junit:4.13.2'
}