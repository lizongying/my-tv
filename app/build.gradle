plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号规则：{major}.{YYMM}.{BUILD_ID}
// release 用 gradle.properties 里的 app.majorVersion；debug 固定 0，保证正式版永远能覆盖调试版。
// YYMM 取构建时的年月（固定东八区，避免 CI 与本地跨月不一致）；
// BUILD_ID 由 CI 传入 -PbuildNumber=${{ github.run_number }}，本地回退到提交数。
def appVersion = DetectVersion(0)

android {
    namespace 'com.lizongying.mytv'
    compileSdk 34

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.tvrcgo.mytv"
        minSdk 21
        targetSdk 33
        versionCode appVersion.code
        versionName appVersion.name

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }
}

// debug 用默认配置（major 0）；release 覆盖为 gradle.properties 里的主版本号
android.applicationVariants.all { variant ->
    if (variant.buildType.name != "debug") {
        def version = DetectVersion(VersionMajor())
        variant.outputs.each { output ->
            output.versionCodeOverride = version.code
            output.versionNameOverride = version.name
        }
    }
}

def DetectVersion(major) {
    def yymm = new Date().format("yyMM", TimeZone.getTimeZone("Asia/Shanghai"))
    def buildId = BuildId()
    def version = [
            code: major * 10000000 + yymm.toInteger() * 10000 + buildId,
            name: "${major}.${yymm}.${buildId}",
    ]
    println("Version ${version.code} ${version.name}")
    return version
}

// 主版本号在 gradle.properties 中维护（app.majorVersion）
def VersionMajor() {
    def fromProperty = project.findProperty("app.majorVersion")
    if (fromProperty != null && fromProperty.toString().isInteger()) {
        return fromProperty.toString().toInteger()
    }
    return 1
}

// 自增构建号：显式参数 > CI 的 github.run_number > 提交数
def BuildId() {
    def fromProperty = project.findProperty("buildNumber")
    if (fromProperty != null && fromProperty.toString().isInteger()) {
        return fromProperty.toString().toInteger()
    }
    def fromEnv = System.getenv("GITHUB_RUN_NUMBER")
    if (fromEnv != null && fromEnv.isInteger()) {
        return fromEnv.toInteger()
    }
    try {
        def process = "git rev-list --count HEAD".execute()
        process.waitFor()
        def text = process.text.trim()
        if (text.isInteger()) {
            return text.toInteger()
        }
    } catch (ignored) {
    }
    return 1
}

dependencies {
    def media3_version = "1.3.1"

    implementation "androidx.media3:media3-ui:$media3_version"

    // For media playback using ExoPlayer
    implementation "androidx.media3:media3-exoplayer:$media3_version"

    // For HLS playback support with ExoPlayer
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"

    // 只用到 okhttp 与 gson（拉取 m3u、序列化源配置），不再依赖 retrofit
    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    implementation "com.google.code.gson:gson:2.10.1"

    implementation 'androidx.leanback:leanback:1.2.0-alpha04'
    
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.core:core-ktx:1.13.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0-RC")

    implementation 'com.google.android.exoplayer:exoplayer-ui:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.13.3'

    testImplementation 'junit:junit:4.13.2'
}